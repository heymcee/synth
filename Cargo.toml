[package]
name = "synth"
version = "0.1.0"
edition = "2021"
description = "Design studio / sequence optimization room. Optimises Seek frames for synthesis and host."
license = "MIT"
readme = "README.md"

[[bin]]
name = "synth"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
